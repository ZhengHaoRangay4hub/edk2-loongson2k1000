name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  EDK2_REF: master

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [RELEASE, DEBUG]

    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Checkout tianocore/edk2
        run: |
          git clone --depth 1 --branch master --recurse-submodules --shallow-submodules https://github.com/tianocore/edk2.git edk2
          echo "EDK2_SHA=$(git -C edk2 rev-parse HEAD)" | tee -a "$GITHUB_ENV"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ make python3 python3-pip uuid-dev nasm iasl device-tree-compiler curl xz-utils
          # Loongson official LoongArch64 cross toolchain (gcc 14.2 / binutils 2.43)
          curl -sL -o /tmp/cross-tools.tar.xz \
            https://github.com/loongson/build-tools/releases/download/2024.08.08/x86_64-cross-tools-loongarch64-binutils_2.43-gcc_14.2.0.tar.xz
          sudo mkdir -p /opt/loongarch64-cross-toolchain
          sudo tar -xf /tmp/cross-tools.tar.xz -C /opt/loongarch64-cross-toolchain
          echo "/opt/loongarch64-cross-toolchain/cross-tools/bin" >> "$GITHUB_PATH"

      - name: Overlay Loongson2K1000Pkg into edk2 tree
        run: |
          mkdir -p edk2/Platform/Loongson
          cp -r Platform/Loongson/Loongson2K1000Pkg edk2/Platform/Loongson/
          # LVGL graphical HII renderer (LvglPkg)
          cp -r LvglPkg edk2/
          # PMON-style #include "x.S" aggregation does not survive EDK2's Trim
          # tool (non-top-level file content is dropped); inline it textually.
          python3 tools/merge_asm_includes.py \
            edk2/Platform/Loongson/Loongson2K1000Pkg/Sec/PreMem/DdrEntry.S \
            > /tmp/DdrEntry.merged.S
          mv /tmp/DdrEntry.merged.S \
            edk2/Platform/Loongson/Loongson2K1000Pkg/Sec/PreMem/DdrEntry.S
          # brand the boot logo + sharper setup resolution for both targets
          cp assets/logo.bmp edk2/MdeModulePkg/Logo/Logo.bmp
          # vendor-style setup theme for both targets
          sed -i 's#MdeModulePkg/Library/CustomizedDisplayLib/CustomizedDisplayLib.inf#Platform/Loongson/Loongson2K1000Pkg/Library/LoongsonSetupThemeLib/CustomizedDisplayLib.inf#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          sed -i 's#  CustomizedDisplayLib             | .*#  CustomizedDisplayLib             | Platform/Loongson/Loongson2K1000Pkg/Library/LoongsonSetupThemeLib/CustomizedDisplayLib.inf\n  LvglLib                          | LvglPkg/Library/LvglLib/LvglLib.inf#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          # LvglPkg demo apps (graphical dashboard)
          sed -i 's#  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf#  LvglPkg/Application/UefiDashboard/UefiDashboard.inf\n  LvglPkg/Application/LvglDemoApp/LvglDemoApp.inf\n  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          sed -i 's#INF  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf#INF  LvglPkg/Application/UefiDashboard/UefiDashboard.inf\nINF  LvglPkg/Application/LvglDemoApp/LvglDemoApp.inf\nINF  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.fdf
          # graphical setup console (already in upstream FDF) + graphical boot manager menu
          # Chinese (zh-Hans) HII translations for the setup UI
          while read -r f; do
            mkdir -p "edk2/$(dirname "$f")"
            cp "assets/hii-zh/$f" "edk2/$f"
          done < <(cd assets/hii-zh && find . -name '*.uni' | sed 's#^\./##')
          sed -i 's#INF  MdeModulePkg/Application/UiApp/UiApp.inf#INF  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf\nINF  MdeModulePkg/Application/UiApp/UiApp.inf#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.fdf
          sed -i 's#{ 0x21, 0xaa, 0x2c, 0x46, 0x14, 0x76, 0x03, 0x45, 0x83, 0x6e, 0x8a, 0xb6, 0xf4, 0x66, 0x23, 0x31 }#{ 0xdc, 0x5b, 0xc2, 0xee, 0xf2, 0x67, 0x95, 0x4d, 0xb1, 0xd5, 0xf8, 0x1b, 0x20, 0x39, 0xd1, 0x1d }#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          sed -i 's#  MdeModulePkg/Application/UiApp/UiApp.inf {#  MdeModulePkg/Application/BootManagerMenuApp/BootManagerMenuApp.inf\n  MdeModulePkg/Application/UiApp/UiApp.inf {#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          sed -i \
            -e 's/PcdVideoHorizontalResolution          | 800/PcdVideoHorizontalResolution          | 1024/' \
            -e 's/PcdVideoVerticalResolution            | 600/PcdVideoVerticalResolution            | 768/' \
            -e 's/PcdSetupVideoHorizontalResolution     | 640/PcdSetupVideoHorizontalResolution     | 1024/' \
            -e 's/PcdSetupVideoVerticalResolution       | 480/PcdSetupVideoVerticalResolution       | 768/' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          # console auto-sizing: 0 = largest text mode of the current mode, so
          # the BIOS UI fills the screen at any resolution
          sed -i 's#\(gEfiMdeModulePkgTokenSpaceGuid.PcdSetupVideoVerticalResolution.*\)#\1\n  gEfiMdeModulePkgTokenSpaceGuid.PcdConOutColumn | 0\n  gEfiMdeModulePkgTokenSpaceGuid.PcdConOutRow | 0\n  gEfiMdeModulePkgTokenSpaceGuid.PcdSetupConOutColumn | 0\n  gEfiMdeModulePkgTokenSpaceGuid.PcdSetupConOutRow | 0#' \
            edk2/OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          # NOTE: the BIOS setup UI uses the text theme engine; upstream
          # LvglPkg ships the LVGL library and apps (UefiDashboard et al.)
          # rather than an HII renderer, so no DisplayEngine swap here.
          # compile the platform DTB before the build consumes it
          D=edk2/Platform/Loongson/Loongson2K1000Pkg/Dts
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp -I $D/include \
              $D/ls2k1000-la.dts | \
            dtc -I dts -O dtb -o $D/ls2k1000-la.dtb -

      - name: Build BaseTools
        working-directory: edk2
        run: |
          export WORKSPACE=$PWD
          make -C BaseTools -j$(nproc)

      - name: Build Loongson2K1000Pkg (LS2K1000LA hardware firmware)
        working-directory: edk2
        run: |
          export WORKSPACE=$PWD
          export PACKAGES_PATH=$WORKSPACE
          export EDK_TOOLS_PATH=$WORKSPACE/BaseTools
          export GCC_LOONGARCH64_PREFIX=loongarch64-unknown-linux-gnu-
          source edksetup.sh BaseTools
          build -b ${{ matrix.target }} -t GCC -a LOONGARCH64 \
            -p Platform/Loongson/Loongson2K1000Pkg/Loongson2K1000Pkg.dsc \
            -n $(nproc)

      - name: Build OvmfPkg/LoongArchVirt (QEMU regression target)
        working-directory: edk2
        run: |
          export WORKSPACE=$PWD
          export PACKAGES_PATH=$WORKSPACE
          export EDK_TOOLS_PATH=$WORKSPACE/BaseTools
          export GCC_LOONGARCH64_PREFIX=loongarch64-unknown-linux-gnu-
          source edksetup.sh BaseTools
          build -b ${{ matrix.target }} -t GCC -a LOONGARCH64 \
            -p OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc \
            -n $(nproc)

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist
          find edk2/Build -name '*.fd' -exec cp -v {} dist/ \; || true
          cp edk2/Platform/Loongson/Loongson2K1000Pkg/Dts/ls2k1000-la.dtb dist/ || true
          ( cd edk2 && git rev-parse HEAD ) > dist/edk2-commit.txt || true
          ls -la dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ls2k1000la-edk2-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
